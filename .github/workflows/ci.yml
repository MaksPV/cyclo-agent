name: ci

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ПК
          - target: x86_64-unknown-linux-musl
            name: pc-x86_64-musl
            image: ghcr.io/cross-rs/x86_64-unknown-linux-musl:main
          - target: aarch64-unknown-linux-musl
            name: pc-aarch64-musl
            image: ghcr.io/cross-rs/aarch64-unknown-linux-musl:main
          # Роутеры (OpenWrt): arm/arm64/mips
          - target: armv7-unknown-linux-musleabihf
            name: router-armv7-musl
            image: ghcr.io/cross-rs/armv7-unknown-linux-musleabihf:main
          - target: aarch64-unknown-linux-musl
            name: router-aarch64-musl
            image: ghcr.io/cross-rs/aarch64-unknown-linux-musl:main
          - target: mipsel-unknown-linux-musl
            name: router-mipsel-musl
            image: ghcr.io/cross-rs/mipsel-unknown-linux-musl:main
          - target: mips-unknown-linux-musl
            name: router-mips-musl
            image: ghcr.io/cross-rs/mips-unknown-linux-musl:main
          # Телефоны (Android/Termux): arm64 + старый 32-битный arm
          - target: aarch64-linux-android
            name: phone-aarch64-android
            image: ghcr.io/cross-rs/aarch64-linux-android:main
          - target: armv7-linux-androideabi
            name: phone-armv7-android
            image: ghcr.io/cross-rs/arm-linux-androideabi:main
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - run: cross build --release --target ${{ matrix.target }}
        env:
          CROSS_CONTAINER_ENGINE: docker
      - uses: actions/upload-artifact@v4
        with:
          name: cyclo-agent-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/cyclo-agent
