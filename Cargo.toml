[package]
name = "cyclo-agent"
version = "0.1.0"
edition = "2021"
description = "Daemon + web UI for Cyclorithm schedules: exec jobs, SQLite history, hot reload"
license = "MIT"

[[bin]]
name = "cyclo-agent"
path = "src/main.rs"

[dependencies]
cyclorithm-core = { path = "../cycloritm/crates/cyclorithm-core" }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "fs"] }
tower = "0.5"
tower-cookies = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rand = "0.8"
clap = { version = "4", features = ["derive"] }
cookie = "0.18"
toml = "0.8"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"
